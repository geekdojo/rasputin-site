{{ define "main" }}
<article class="band">
  <div class="wrap narrow">
    <p class="post-date muted"><a href="{{ "docs/" | relURL }}">Docs</a> ›</p>
    <h1>{{ .Title }}</h1>
    <p class="post-date muted">{{ partial "applies-to.html" (index .Params "applies-to") }}</p>
    <div class="prose">
      {{ .Content }}
      {{ partial "hardware-tables.html" . }}
    </div>
    <hr class="rule">
    <p class="muted">Something wrong or missing on this page? <a href="{{ site.Params.docIssueUrl }}">Tell us</a> — docs bugs count too.</p>
  </div>
</article>
{{ end }}
