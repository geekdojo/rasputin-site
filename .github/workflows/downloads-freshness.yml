name: downloads-freshness

# Backstop for the Download page (content/download.md, rendered from
# data/releases.json).
#
# The Download page is auto-generated at deploy time by scripts/fetch-releases.sh
# (deploy.yml: on push, on a daily schedule, and on a release-published
# dispatch), which resolves each product's latest STABLE release from the GitHub
# API. The committed data/releases.json is only a best-effort fallback used if
# that resolve fails — so if fetch-releases.sh ever breaks quietly (an API shape
# change, a jq error), deploy silently serves the stale fallback and nobody
# notices. This is the alarm for exactly that: once a week it compares what the
# LIVE page actually serves against each repo's real latest stable, and files ONE
# issue when they diverge — the same shape as roadmap-freshness. It reuses/updates
# the open issue instead of piling up duplicates, closes it when the page is back
# in sync, and says nothing when everything agrees.
#
# Scheduled after the daily deploy (deploy.yml runs 08:17 UTC) so a normal cut has
# already propagated; a one-off gap within ~24h of a stable cut is benign and
# clears on the next daily deploy — a gap that persists to the weekly run is a
# real break in the resolve/deploy path.

on:
  schedule:
    - cron: "37 9 * * 2" # Tuesdays, ~80 min after the daily deploy
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: geekdojo
      SITE_URL: https://rasputin.geekdojo.com/releases.json
    steps:
      - name: Ensure the label exists
        run: gh label create downloads-freshness --repo "$GITHUB_REPOSITORY" --color BFDADC --description "Download page is stale vs the latest stable release" --force || true

      - name: Compare the live Download page against the latest stable releases
        run: |
          set -uo pipefail

          # Latest STABLE tag per product — /releases/latest excludes prereleases.
          os_latest=$(gh api "repos/${OWNER}/rasputin-os/releases/latest" -q .tag_name 2>/dev/null || true)
          fw_latest=$(gh api "repos/${OWNER}/rasputin-openwrt-firewall/releases/latest" -q .tag_name 2>/dev/null || true)

          # What the LIVE Download page actually serves (the mirrored /releases.json).
          live=$(curl -fsSL --max-time 30 "$SITE_URL" 2>/dev/null || true)
          os_live=$(printf '%s' "$live" | jq -r '.os.version // empty' 2>/dev/null || true)
          fw_live=$(printf '%s' "$live" | jq -r '.firewall.version // empty' 2>/dev/null || true)

          # If any side wouldn't resolve, this run can't judge — don't false-alarm.
          if [ -z "$os_latest" ] || [ -z "$fw_latest" ] || [ -z "$os_live" ] || [ -z "$fw_live" ]; then
            echo "incomplete data (os_latest=$os_latest fw_latest=$fw_latest os_live=$os_live fw_live=$fw_live) — skipping this run"
            exit 0
          fi

          echo "live: os=$os_live fw=$fw_live | latest-stable: os=$os_latest fw=$fw_latest"

          drift=""
          [ "$os_live" != "$os_latest" ] && drift="${drift}- **rasputin-os**: page serves \`${os_live}\`, latest stable is \`${os_latest}\`\n"
          [ "$fw_live" != "$fw_latest" ] && drift="${drift}- **firewall**: page serves \`${fw_live}\`, latest stable is \`${fw_latest}\`\n"

          TITLE="Download page stale vs latest stable release"
          EXISTING=$(gh issue list --label downloads-freshness --state open --json number --jq '.[0].number // empty')

          if [ -z "$drift" ]; then
            echo "in sync"
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Download page back in sync (os \`${os_live}\`, firewall \`${fw_live}\`)."
            fi
            exit 0
          fi

          BODY=$(printf '%b' "The live Download page (\`/releases.json\`, generated by \`scripts/fetch-releases.sh\` at deploy time) disagrees with the newest STABLE release:\n\n${drift}\nThe deploy-time resolve is likely failing, so the page is serving the committed best-effort fallback. Check the latest \`deploy.yml\` run and \`scripts/fetch-releases.sh\`. The daily deploy self-heals a transient, so a gap that reaches this weekly run is a real break. (A one-off within ~24h of a stable cut is benign and clears on the next daily deploy.)")

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "updated issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label downloads-freshness
          fi
